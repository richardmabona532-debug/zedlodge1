<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Urban Lodge Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f5;
    color: #222;
}

button,
input,
select {
    font: inherit;
}

button {
    background: #c49a45;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #a77e32;
}

/* LOGIN */

.login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: #12372d;
}

.login-card {
    width: min(420px, 100%);
    background: white;
    border-radius: 14px;
    padding: 30px;
    box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.login-card h1 {
    color: #12372d;
    margin-bottom: 8px;
}

.login-card p {
    color: #666;
    margin-bottom: 22px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
    color: #555;
}

.field input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

.login-message {
    margin-top: 12px;
    color: #b42318;
}

/* APP */

.app {
    display: none;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 230px;
    height: 100vh;
    background: #12372d;
    color: white;
    padding: 25px 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 40px;
    padding-left: 10px;
}

.logo span {
    color: #c49a45;
}

.menu a {
    display: block;
    padding: 14px 12px;
    margin-bottom: 8px;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

.menu a:hover,
.menu .active {
    background: #c49a45;
}

/* MAIN */

.main {
    margin-left: 230px;
    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.topbar h1 {
    color: #12372d;
}

.admin {
    background: white;
    padding: 10px 15px;
    border-radius: 6px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.card h3 {
    color: #777;
    font-size: 14px;
    margin-bottom: 10px;
}

.card strong {
    font-size: 32px;
    color: #12372d;
}

/* SECTIONS */

.section {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 30px;
}

.section h2 {
    margin-bottom: 20px;
    color: #12372d;
}

/* ROOMS */

.room-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 15px;
}

.room {
    padding: 18px;
    border: 1px solid #ddd;
    border-radius: 9px;
}

.room h3 {
    margin-bottom: 7px;
}

.room p {
    color: #666;
    font-size: 13px;
    margin-bottom: 12px;
}

.room select {
    width: 100%;
    padding: 9px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

/* TABLE */

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
}

th,
td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    color: #666;
    font-size: 13px;
}

/* STATUS */

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: capitalize;
}

.available,
.confirmed {
    background: #dff5e8;
    color: #19713d;
}

.pending {
    background: #fff0bd;
    color: #806000;
}

.occupied,
.cancelled {
    background: #ffdada;
    color: #a02020;
}

.cleaning {
    background: #dcecff;
    color: #24598f;
}

/* ACTIONS */

.actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.confirm {
    background: #19713d;
}

.cancel {
    background: #a02020;
}

.small {
    padding: 7px 9px;
    font-size: 12px;
}

/* TOOLBAR */

.toolbar {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.toolbar input {
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    min-width: 240px;
}

.notice {
    padding: 12px;
    background: #f7f2e6;
    border-radius: 7px;
    margin-bottom: 18px;
    font-size: 14px;
}

/* MOBILE */

@media(max-width:700px) {

    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .menu {
        display: flex;
        overflow-x: auto;
    }

    .menu a {
        white-space: nowrap;
        margin-right: 5px;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .topbar {
        display: block;
    }

    .admin {
        margin-top: 10px;
    }

}

</style>
</head>

<body>
